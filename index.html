<!doctype html>
<html lang="pt-BR" data-theme="noite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#032741" />
    <meta name="description" content="Portfólio de COLOMBIA ROCHA, designer e artista audiovisual." />
    <title>COLOMBIA ROCHA — Portfólio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="COLOMBIA ROCHA" />
    <meta property="og:title" content="COLOMBIA ROCHA — Portfólio" />
    <meta property="og:description" content="Portfólio de COLOMBIA ROCHA, designer e artista audiovisual." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pick the art direction before the first paint: ?tema= wins, then the visitor's last choice.
      (function () {
        var DEFAULT_THEME = 'noite'
        var theme = DEFAULT_THEME
        try {
          var stored = localStorage.getItem('colombia.theme')
          if (stored === 'papel' || stored === 'noite') theme = stored
          var asked = new URLSearchParams(location.search).get('tema')
          if (asked === 'papel' || asked === 'noite') {
            theme = asked
            localStorage.setItem('colombia.theme', asked)
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'papel') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f1e5d1')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
